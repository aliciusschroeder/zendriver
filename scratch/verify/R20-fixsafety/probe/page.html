<!doctype html><html><body>
<form id="f" onsubmit="event.preventDefault(); window.submits=(window.submits||0)+1;">
<input id="inp" type="text"><button type="submit">go</button></form>
<textarea id="ta"></textarea>
<div id="ce" contenteditable="true"></div>
<script>
window.submits=0; window.kp=[];
for (const id of ['inp','ta','ce']) document.getElementById(id).addEventListener('keypress', e=>window.kp.push([id,e.key,e.charCode,e.keyCode]));
</script>
</body></html>

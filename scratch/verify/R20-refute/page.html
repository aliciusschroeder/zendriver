<!doctype html><html><body>
<form id="f" onsubmit="event.preventDefault(); window.submits=(window.submits||0)+1; return false;">
<input id="inp" type="text"><button type="submit">go</button></form>
<textarea id="ta"></textarea>
<div id="ce" contenteditable="true"></div>
<script>
window.submits=0; window.log=[];
for (const t of ['keydown','keypress','keyup','beforeinput','input']) {
  document.addEventListener(t, e => window.log.push(t+':'+JSON.stringify(e.key||'')+':'+(e.charCode||0)+':'+(e.inputType||'')), true);
}
</script></body></html>
